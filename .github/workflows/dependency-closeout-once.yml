name: One-time reviewed dependency cleanup
on:
  push:
    branches: [codex/repository-cleanup-dependencies-20261112]
    paths:
      - .github/workflows/dependency-closeout-once.yml
      - .github/scripts/dependency_closeout_once.py
      - .github/scripts/dependency-branches-manifest.json
      - .github/scripts/dependency-branches-previous.json
permissions:
  contents: write
concurrency:
  group: repository-dependency-closeout-20261112
  cancel-in-progress: false
jobs:
  archive-and-prune:
    if: github.repository == 'Serendipity-min/medical-multi-parameter-monitor' && github.ref == 'refs/heads/codex/repository-cleanup-dependencies-20261112'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Fetch all reviewed history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Archive, verify and delete exact reviewed dependency refs
        env:
          EXPECTED_MAIN: a5c6dd5f2d2509e5259986e29248076a3ce187ac
        run: |
          python3 .github/scripts/dependency_closeout_once.py \
            --manifest .github/scripts/dependency-branches-manifest.json \
            --previous-manifest .github/scripts/dependency-branches-previous.json \
            --expected-main "$EXPECTED_MAIN" \
            --execute
