name: Gateway and cloud checks
on:
  push:
    branches: [dev/p-gateway-cloud-v07, fix/p4-security-closeout]
  pull_request:
    branches: [main, integration/v0.7, P4]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: phase1-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # 固定 Action 提交；CI 仅做无凭据测试和构建，不连接服务器或开发板。
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: cloud/web/package-lock.json
      - name: Install locked test dependencies
        run: python -m pip install -r cloud/backend/requirements-dev.txt -c cloud/backend/requirements.lock
      - name: Backend and operations regressions
        run: python -m pytest cloud/backend/tests -q
      - name: Paho vendor integrity and Gateway source allowlist
        run: |
          python gateway/third_party/verify_paho_integrity.py
          python -m unittest discover -s gateway/third_party/tests -p 'test_*.py'
      # 固定本机输入与现有 ASan/UBSan 用例；不进行随机输入、网络测试或自动扫描。
      - name: Fixed MQTT sanitizer regressions
        run: python gateway/canopen/run_security_regression.py
      - name: CANopenNode protocol and offline router
        run: python gateway/canopen/build_host.py
      - name: C canonical frames accepted by Backend
        run: python gateway/canopen/tools/check_canonical.py
      - name: Build monitoring UI
        working-directory: cloud/web
        run: |
          npm ci --no-audit --no-fund
          npm run build
