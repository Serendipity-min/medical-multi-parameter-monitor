name: Gateway and cloud checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: phase1-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # 固定 Action 提交；CI 仅做无凭据测试和构建，不连接服务器或开发板。
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: cloud/web/package-lock.json
      - name: Install locked test dependencies
        run: python -m pip install -r cloud/backend/requirements-dev.txt -c cloud/backend/requirements.lock
      - name: Backend and operations regressions
        run: python -m pytest cloud/backend/tests -q
      # 正式设备端已使用 coreMQTT；这里只跑普通功能回归，不启用扫描器或 sanitizer。
      - name: Pinned coreMQTT and ordinary MQTT regressions
        run: |
          python gateway/third_party/verify_coremqtt_integrity.py
          python gateway/mqtt/tests/run_p5_host_tests.py
          python -m unittest discover -s gateway/mqtt/tests -p 'test_p5_integrity.py'
          python gateway/mqtt/tests/test_p5_emcy_console.py
      - name: CANopenNode protocol and offline router
        run: python gateway/canopen/build_host.py
      - name: C canonical frames accepted by Backend
        run: python gateway/canopen/tools/check_canonical.py
      - name: Five-node freshness and formal WebAI gateway regressions
        env:
          MPM_NODE_PROFILE: five
        run: |
          python -m pytest -q \
            cloud/backend/tests/test_five_node.py::test_completion_age_is_not_extended_by_duplicate \
            cloud/ai/tests/test_five_appliance.py::test_real_api_default_voice_disabled_and_auth \
            cloud/ai/tests/test_five_appliance.py::test_formal_gateway_requires_explicit_configuration
      - name: Build monitoring UI
        working-directory: cloud/web
        run: |
          npm ci --no-audit --no-fund
          # 总览、趋势与问答共用状态的固定回归，无网络目标。
          npm test
          npm run build
