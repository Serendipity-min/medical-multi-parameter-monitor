# 独立项目服务，不读取或覆盖 /etc/mosquitto 中其他项目的配置。
user mosquitto
listener 8883
allow_anonymous false
password_file /opt/medical-monitor/broker/passwords
acl_file /opt/medical-monitor/broker/acl
certfile /opt/medical-monitor/broker/tls/server-chain.pem
keyfile /opt/medical-monitor/broker/tls/server-key.pem
tls_version tlsv1.2
persistence true
persistence_location /opt/medical-monitor/broker/data/
autosave_interval 60
max_packet_size 32768
message_size_limit 32768
max_inflight_messages 20
max_queued_messages 256
# 原始日志只进入代理管道；固定类别/数字码经白名单处理后进入 journal 与轮转文件。
connection_messages false
log_type error
log_type warning
log_type notice
log_dest stdout
