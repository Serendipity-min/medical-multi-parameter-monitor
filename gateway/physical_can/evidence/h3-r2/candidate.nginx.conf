location = /medical-monitor { return 301 /medical-monitor/; }
location ^~ /medical-monitor/ai/ {
 client_max_body_size 4k;
 proxy_pass http://127.0.0.1:18786;
 proxy_set_header Host $host;
 proxy_set_header X-Forwarded-Proto $scheme;
 proxy_connect_timeout 2s;
 proxy_read_timeout 15s;
 access_log off;
}
location ^~ /medical-monitor/ws/ {
 proxy_pass http://127.0.0.1:18785/ws/;
 proxy_http_version 1.1;
 proxy_set_header Upgrade $http_upgrade;
 proxy_set_header Connection "upgrade";
 proxy_set_header Host $host;
 proxy_buffering off;
 proxy_read_timeout 60s;
 access_log off;
}
location ^~ /medical-monitor/api/ {
 proxy_pass http://127.0.0.1:18785/api/;
 access_log off;
}
location ^~ /medical-monitor/ {
 alias \opt\medical-monitor-h3\releases\runtime-R2-REPREPARE-REQUIRED\cloud\web\dist/;
 index index.html;
 access_log off;
}
